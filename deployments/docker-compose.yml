services:
  postgres:
    image: postgres:16-alpine
    container_name: ff-postgres
    environment:
      POSTGRES_USER: ff_admin
      POSTGRES_PASSWORD: ff_secret_password
      POSTGRES_DB: feature_flags
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ff_admin -d feature_flags"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ff-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: ff-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter scrape endpoint

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ff-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.3.0
    container_name: ff-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  control-plane:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: ff-control-plane
    entrypoint: ["/usr/local/bin/control-plane"]
    environment:
      CONTROL_PLANE_HTTP_ADDR: ":8080"
      POSTGRES_DSN: "postgres://ff_admin:ff_secret_password@postgres:5432/feature_flags?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  data-plane:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: ff-data-plane
    entrypoint: ["/usr/local/bin/data-plane"]
    environment:
      DATA_PLANE_GRPC_ADDR: ":9090"
      POSTGRES_DSN: "postgres://ff_admin:ff_secret_password@postgres:5432/feature_flags?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    ports:
      - "9090:9090"
    depends_on:
      control-plane:
        condition: service_started

  demo-app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: ff-demo-app
    entrypoint: ["/usr/local/bin/demo-app"]
    environment:
      CONTROL_PLANE_URL: "http://control-plane:8080"
      DATA_PLANE_GRPC_ADDR: "data-plane:9090"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    depends_on:
      - data-plane

